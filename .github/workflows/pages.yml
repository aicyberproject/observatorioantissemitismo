name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A coleta de noticias roda no build. Sem execucao periodica o painel
  # congela na ultima publicacao.
  #
  # CADENCIA: decisao aberta. A cada 30 minutos sao ~48 publicacoes por dia do
  # sitio inteiro para atualizar um arquivo de 40 KB. Como o historico agora
  # tem granularidade diaria, a serie nao perde nada com cadencia menor.
  # Para reduzir, troque por '0 */2 * * *' (de duas em duas horas).
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write        # necessario para gravar o historico no branch de dados
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Branch orfao que guarda apenas data/historico/. Fica fora de main para que o
# historico do codigo nao receba commit automatico a cada coleta.
env:
  BRANCH_DADOS: dados

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.html_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. Recupera o historico ja acumulado. Se o branch ainda nao existe, o
      #    passo e tolerante e a serie comeca no primeiro dia.
      - name: Recuperar historico acumulado
        continue-on-error: true
        run: |
          git fetch origin "$BRANCH_DADOS" --depth=1 || exit 0
          git restore --source="origin/$BRANCH_DADOS" -- data/historico || true
          ls -la data/historico 2>/dev/null || echo "sem historico previo"

      # 2. Coleta. Falha total nao derruba o deploy: o site sobe e a pagina
      #    exibe o estado de painel indisponivel.
      - name: Agregar noticias das fontes registradas
        continue-on-error: true
        run: python3 scripts/agregar.py

      # 3. Persiste o instantaneo do dia e reconstroi o indice. Granularidade
      #    diaria: a execucao do dia sobrescreve o arquivo do dia, acumulando
      #    itens novos. Dias anteriores nunca sao tocados.
      - name: Persistir instantaneo do dia
        continue-on-error: true
        run: python3 scripts/historico.py

      # 4. Gera as edicoes semanais do boletim a partir do historico.
      - name: Gerar boletim semanal
        continue-on-error: true
        run: python3 scripts/gerar_boletim.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4

      # 5. Por ultimo, devolve o historico ao branch de dados. Sem este passo
      #    nada se acumula: o artefato publicado e efemero.
      #
      #    Roda DEPOIS do deploy, e nao antes, porque monta o branch orfao em
      #    diretorio separado. Fazer isso na propria arvore de trabalho
      #    destruiria os arquivos do sitio antes do upload do artefato.
      #
      #    DECISAO ABERTA: este passo introduz commit automatico no repositorio,
      #    em branch proprio. Trocar `if: false` por `if: true` para ativar.
      - name: Gravar historico no branch de dados
        if: false
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -d data/historico ] || [ -z "$(ls -A data/historico 2>/dev/null)" ]; then
            echo "sem historico a gravar"; exit 0
          fi
          area="$(mktemp -d)"
          cp -a data/historico/. "$area/"

          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          clone="$(mktemp -d)"
          if git clone --depth 1 --branch "$BRANCH_DADOS" "$repo" "$clone" 2>/dev/null; then
            echo "branch $BRANCH_DADOS recuperado"
          else
            echo "branch $BRANCH_DADOS ainda nao existe: criando"
            git init -q "$clone"
            git -C "$clone" remote add origin "$repo"
            git -C "$clone" checkout -q --orphan "$BRANCH_DADOS"
          fi

          rm -rf "$clone/data/historico"
          mkdir -p "$clone/data/historico"
          cp -a "$area/." "$clone/data/historico/"

          cd "$clone"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/historico
          if git diff --cached --quiet; then echo "historico sem mudanca"; exit 0; fi
          git commit -q -m "Instantaneo de $(date -u +%F)"
          git push -f origin "HEAD:$BRANCH_DADOS"
          echo "historico gravado em $BRANCH_DADOS"
